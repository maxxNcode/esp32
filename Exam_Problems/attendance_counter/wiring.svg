<text x="56" y="1008" font-size="13" fill="#222" text-anchor="start">POWER:  +5V = Arduino 5V pin -&gt; breadboard red (+) rail.   GND symbol = Arduino GND -&gt; blue (-) rail.  ALL grounds connect together.</text>
<text x="56" y="1032" font-size="13" fill="#222" text-anchor="start">7-SEGMENT:  D2..D8 -&gt; one 220Ω resistor each -&gt; segments a..g.   Both COM pins -&gt; GND (common cathode).</text>
<text x="56" y="1056" font-size="13" fill="#222" text-anchor="start">HC-05:  VCC -&gt; 5V, GND -&gt; GND, TXD -&gt; D10, RXD &lt;- D11 through 1kΩ (with 2kΩ from RXD to GND).  Default PIN 1234 / 0000, 9600 baud.</text>
<text x="56" y="1080" font-size="13" fill="#222" text-anchor="start">BUTTONS:  across the breadboard gap; one leg -&gt; pin, diagonal leg -&gt; GND (INPUT_PULLUP, pressed = LOW).</text>
<text x="56" y="1104" font-size="13" fill="#222" text-anchor="start">LCD I2C:  GND -&gt; GND, VCC -&gt; 5V, SDA -&gt; A4, SCL -&gt; A5.   BUZZER: + -&gt; D9, - -&gt; GND.</text>
</svg>